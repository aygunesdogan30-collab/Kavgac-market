!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; }
        .header { background: linear-gradient(135deg, #ffcc00, #ff8800); padding: 25px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(255, 136, 0, 0.3); }
        .header h1 { margin: 0; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item { background: #151515; border: 1px solid #222; border-radius: 18px; padding: 15px; position: relative; border-bottom: 4px solid #ff8800; }
        .price { color: #ffcc00; font-weight: bold; font-size: 18px; margin: 8px 0; }
        .buy-btn { background: #ff8800; color: black; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .buy-btn:active { transform: scale(0.9); }
        .tag { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; padding: 4px 8px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>KAVGACI STORE</h1>
        <p>Hızlı ve Güvenilir Elmas</p>
    </div>

    <div class="grid">
        <div class="item"><h3>30 ELMAS</h3><div class="price">25 TL</div><button class="buy-btn" onclick="order('30 Elmas')">AL</button></div>
        <div class="item"><span class="tag">POPÜLER</span><h3>80 ELMAS</h3><div class="price">60 TL</div><button class="buy-btn" onclick="order('80 Elmas')">AL</button></div>
        <div class="item"><h3>170 ELMAS</h3><div class="price">120 TL</div><button class="buy-btn" onclick="order('170 Elmas')">AL</button></div>
        <div class="item"><span class="tag">FIRSAT</span><h3>360 ELMAS</h3><div class="price">240 TL</div><button class="buy-btn" onclick="order('360 Elmas')">AL</button></div>
        <div class="item"><h3>950 ELMAS</h3><div class="price">550 TL</div><button class="buy-btn" onclick="order('950 Elmas')">AL</button></div>
        <div class="item"><span class="tag">KRAL</span><h3>2000 ELMAS</h3><div class="price">1100 TL</div><button class="buy-btn" onclick="order('2000 Elmas')">AL</button></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function order(val) {
            tg.showConfirm(val + " paketini almak istiyor musun?", function(ok) {
                if(ok) {
                    tg.sendData(val); // Siparişi bota yollar
                    tg.close();
                }
            });
        }
    </script>
</body>
</html>
