<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; }
        .card { background: #1e1e1e; border: 2px solid #f39c12; border-radius: 15px; padding: 15px; margin: 10px; }
        .btn { background: #f39c12; color: black; border: none; padding: 10px; width: 90%; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚔️ KAVGACI MARKET</h1>
    <div class="card">
        <h3>80 ELMAS</h3>
        <p>✨ 50 Yıldız</p>
        <button class="btn" onclick="tg.showAlert('Sipariş Alındı!')">SATIN AL</button>
    </div>
    <script>let tg = window.Telegram.WebApp; tg.expand();</script>
</body>
</html>
